name: ci-backend

on:
  pull_request:
    paths:
      - "apps/backend/**"
      - ".github/workflows/ci-backend.yml"
      - ".github/workflows/cd-backend.yml"
      - ".github/actions/**"
      - ".dive-ci"

permissions:
  contents: read

concurrency:
  group: ci-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: { distribution: temurin, java-version: "21" }

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Kotlin lint, integration tests, and 95% coverage
        working-directory: apps/backend
        run: ./gradlew check --no-daemon

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: coverage-backend
          path: apps/backend/build/reports

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: ./.github/actions/docker-build
        with:
          app: backend
          image: vantara-backend:${{ github.sha }}

      - uses: ./.github/actions/security
        with:
          source: apps/backend
          image: vantara-backend:${{ github.sha }}

      - uses: ./.github/actions/docker-efficiency
        with:
          image: vantara-backend:${{ github.sha }}
