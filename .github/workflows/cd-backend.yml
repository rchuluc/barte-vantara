name: cd-backend

on:
  workflow_dispatch:

  push:
    branches: [main]
    paths:
      - "apps/backend/**"
      - ".github/workflows/cd-backend.yml"
      - ".github/actions/**"
      - ".dive-ci"

permissions:
  contents: read

concurrency:
  group: cd-backend
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: { distribution: temurin, java-version: "21" }

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Kotlin lint, integration tests, and 95% coverage
        working-directory: apps/backend
        run: ./gradlew check --no-daemon

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: coverage-backend
          path: apps/backend/build/reports

  deploy:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: prod-backend
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: ./.github/actions/docker-build
        with:
          app: backend
          image: vantara-backend:${{ github.sha }}

      - uses: ./.github/actions/security
        with:
          source: apps/backend
          image: vantara-backend:${{ github.sha }}

      - uses: ./.github/actions/docker-efficiency
        with:
          image: vantara-backend:${{ github.sha }}

      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: ./.github/actions/ecr-publish
        id: publish
        with:
          image: vantara-backend:${{ github.sha }}
          repository: ${{ vars.ECR_REPOSITORY }}
          url: ${{ vars.ECR_URL }}

      - uses: ./.github/actions/ecs-deploy
        with:
          app: backend
          image: ${{ steps.publish.outputs.image }}
          cluster: ${{ vars.ECS_CLUSTER }}
          service: ${{ vars.ECS_SERVICE }}
          migration-family: ${{ vars.MIGRATION_FAMILY }}
          migration-network: ${{ vars.MIGRATION_NETWORK }}
