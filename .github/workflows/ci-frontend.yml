name: ci-frontend

on:
  pull_request:
    paths:
      - "apps/frontend/**"
      - ".github/workflows/ci-frontend.yml"
      - ".github/workflows/cd-frontend.yml"
      - ".github/actions/**"
      - ".dive-ci"

permissions:
  contents: read

concurrency:
  group: ci-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Formatting, lint, types, tests, and 95% coverage
        working-directory: apps/frontend
        run: |
          npm ci
          npm run format:check
          npm run lint
          npm run typecheck
          npm run test:coverage

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-frontend
          path: apps/frontend/coverage

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: ./.github/actions/docker-build
        with:
          app: frontend
          image: vantara-frontend:${{ github.sha }}

      - uses: ./.github/actions/security
        with:
          source: apps/frontend
          image: vantara-frontend:${{ github.sha }}
          ignorefile: apps/frontend/.trivyignore.yaml

      - uses: ./.github/actions/docker-efficiency
        with:
          image: vantara-frontend:${{ github.sha }}
