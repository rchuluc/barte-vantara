name: Security checks
description: Fail on high or critical vulnerabilities, secrets, and misconfiguration
inputs:
  source:
    description: Source directory to scan
    required: true
  image:
    description: Optional local image to scan, including unfixed CVEs
    default: ""
runs:
  using: composite
  steps:
    - name: Scan source
      uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
      with:
        scan-type: fs
        scan-ref: ${{ inputs.source }}
        scanners: vuln,secret,misconfig
        severity: HIGH,CRITICAL
        exit-code: "1"

    - name: Scan image
      if: inputs.image != ''
      uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
      with:
        image-ref: ${{ inputs.image }}
        severity: HIGH,CRITICAL
        exit-code: "1"
        format: table
