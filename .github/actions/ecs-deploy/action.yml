name: ECS deployment
description: Migrate and deploy an immutable image, rejecting failed or rolled-back releases
inputs:
  app:
    description: frontend or backend
    required: true
  image:
    description: ECR image pinned by digest
    required: true
  cluster:
    description: ECS cluster
    required: true
  service:
    description: ECS service
    required: true
  migration-family:
    description: Backend migration task family
    default: ""
  migration-network:
    description: Backend Fargate network configuration JSON
    default: ""
runs:
  using: composite
  steps:
    - name: Migrate, deploy, and verify health
      shell: bash
      env:
        APP: ${{ inputs.app }}
        DEPLOY_IMAGE: ${{ inputs.image }}
        ECS_CLUSTER: ${{ inputs.cluster }}
        ECS_SERVICE: ${{ inputs.service }}
        MIGRATION_FAMILY: ${{ inputs.migration-family }}
        MIGRATION_NETWORK: ${{ inputs.migration-network }}
      run: |
        set -euo pipefail
        [[ "$APP" == frontend || "$APP" == backend ]]
        [[ "$DEPLOY_IMAGE" =~ @sha256:[a-f0-9]{64}$ ]]

        register() {
          local definition revision
          definition=$(aws ecs describe-task-definition --task-definition "$1" --output json)
          definition=$(jq -ce --arg container "$2" --arg image "$DEPLOY_IMAGE" '
            .taskDefinition
            | if ([.containerDefinitions[] | select(.name == $container)] | length) != 1
              then error("Expected exactly one target container") else . end
            | del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                  .compatibilities, .registeredAt, .registeredBy, .deregisteredAt)
            | (.containerDefinitions[] | select(.name == $container) | .image) = $image
          ' <<< "$definition")
          revision=$(aws ecs register-task-definition --cli-input-json "$definition" --output json)
          jq -er '.taskDefinition.taskDefinitionArn' <<< "$revision"
        }

        if [[ "$APP" == backend ]]; then
          revision=$(register "$MIGRATION_FAMILY" migrate)
          result=$(aws ecs run-task --cluster "$ECS_CLUSTER" --task-definition "$revision" \
            --launch-type FARGATE --network-configuration "$MIGRATION_NETWORK" --output json)
          task=$(jq -er 'if ((.failures // []) | length) == 0 and (.tasks | length) == 1
            then .tasks[0].taskArn else error("Migration failed to start") end' <<< "$result")
          aws ecs wait tasks-stopped --cluster "$ECS_CLUSTER" --tasks "$task"
          result=$(aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks "$task" --output json)
          jq -e '((.failures // []) | length) == 0 and (.tasks | length) == 1
            and ([.tasks[0].containers[] | select(.name == "migrate" and .exitCode == 0)] | length) == 1' \
            <<< "$result" >/dev/null || { echo 'Migration failed; inspect ECS migration logs'; exit 1; }
        fi

        before=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" --output json)
        template=$(jq -er 'if ((.failures // []) | length) == 0 and (.services | length) == 1
          then .services[0].taskDefinition else error("Service not found") end' <<< "$before")
        revision=$(register "$template" "$APP")
        aws ecs update-service --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" \
          --task-definition "$revision" >/dev/null
        aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE"
        after=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" --output json)
        jq -e --arg revision "$revision" '
          ((.failures // []) | length) == 0 and (.services | length) == 1
          and (.services[0] | .taskDefinition == $revision and .desiredCount > 0
            and .runningCount == .desiredCount and .pendingCount == 0
            and any(.deployments[]; .taskDefinition == $revision and .rolloutState == "COMPLETED"))
        ' <<< "$after" >/dev/null || { echo 'Deployment rolled back or has no healthy running capacity'; exit 1; }
        echo "Deployed $APP: $DEPLOY_IMAGE" >> "$GITHUB_STEP_SUMMARY"
