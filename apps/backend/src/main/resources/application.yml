spring:
  application:
    name: vantara-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/vantara}
    username: ${DB_USER:app_user}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
  flyway:
    enabled: false
  lifecycle:
    timeout-per-shutdown-phase: 25s
server:
  shutdown: graceful
management:
  endpoints:
    web:
      base-path: /api
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
      show-details: never
logging:
  structured:
    format:
      console: logstash

cognito:
  region: ${AWS_REGION:us-east-1}
  pool-id: ${COGNITO_POOL_ID:unconfigured}
  client-id: ${COGNITO_CLIENT_ID:unconfigured}
  mcp-client-id: ${COGNITO_MCP_CLIENT_ID:}
  issuer: ${COGNITO_ISSUER:https://cognito-idp.us-east-1.amazonaws.com/unconfigured}
  jwks-uri: ${COGNITO_JWKS_URI:${cognito.issuer}/.well-known/jwks.json}
  endpoint: ${COGNITO_ENDPOINT:}
